target-version = "py311"
line-length = 110
extend-exclude = [".venv", "__pycache__"]

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit security rules
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function calls in defaults are intentional for DI
]

[lint.per-file-ignores]
# Tests assert, and use hard-coded sample secrets by design.
"tests/*" = ["S101", "S105", "S106"]
# The validator makes deliberate unauthenticated calls to pre-signed URLs.
"scripts/validate_github_api.py" = ["S310"]

[lint.isort]
known-first-party = ["shared"]
