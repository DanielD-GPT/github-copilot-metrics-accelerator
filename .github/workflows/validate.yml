name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep templates
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "Bicep compiled successfully."

  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/functions/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/functions/requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q src/functions scripts

      - name: Unit tests
        run: python -m pytest tests -q
